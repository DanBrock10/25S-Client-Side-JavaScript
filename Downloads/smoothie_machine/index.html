<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smoothie Machine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1> The Smoothie Machine </h1>

  <form id="smoothieForm">
    <label for="customerName">Name: 
      <input type="text" id="customerName" required>
    </label>

    <label for="size">Size:
      <select id="size">
        <option>Small</option>
        <option>Medium</option>
        <option>Large</option>
      </select>
    </label>

    <label for="base">Base:
      <select id="base">
        <option>Water</option>
        <option>Milk</option>
        <option>Yogurt</option>
        <option>Almond Milk</option>
      </select>
    </label>

    <fieldset>
      <legend>Ingredients</legend>
      <label><input type="checkbox" value="Banana"> Banana</label>
      <label><input type="checkbox" value="Strawberry"> Strawberry</label>
      <label><input type="checkbox" value="Spinach"> Spinach</label>
      <label><input type="checkbox" value="Protein Powder"> Protein Powder</label>
      <label><input type="checkbox" value="Blueberry"> Blueberry</label>
      <label><input type="checkbox" value="Mango"> Mango</label>
    </fieldset>

    <label for="notes">Notes: <textarea id="notes"></textarea></label>

    <button type="submit">Order</button>
  </form>

  <div id="output"></div>
  <div id="sizeImages"></div>

<script src="script.js"></script>
</body>
</html>
